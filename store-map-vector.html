<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>디자인무드 위치 안내 약도 (SVG Vector)</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background-color: #FAF8F5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .map-card {
      width: 900px;
      background: #FFFFFF;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
      border: 1px solid #EAE3D8;
      overflow: hidden;
    }
    .map-header {
      padding: 20px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #FAF7F2;
      border-bottom: 1px solid #EAE3D8;
    }
    .map-title {
      font-size: 18px;
      font-weight: 700;
      color: #5C3D2E;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .map-address {
      font-size: 14px;
      font-weight: 700;
      color: #2C1A11;
    }
    .svg-wrapper {
      width: 100%;
      background-color: #F4F3F0;
    }
    svg {
      width: 100%;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>

  <div class="map-card">
    <div class="map-header">
      <div class="map-title">📍 오시는 길 &amp; 도보 약도</div>
      <div class="map-address">충열로16번길 21-20 1층, 디자인무드</div>
    </div>
    
    <div class="svg-wrapper">
      <svg viewBox="0 0 900 640">
        <defs>
          <!-- Soft Drop Shadow Filter for Buildings -->
          <filter id="building-shadow" x="-5%" y="-5%" width="110%" height="110%">
            <feDropShadow dx="1" dy="2" stdDeviation="2" floodColor="#000000" floodOpacity="0.06" />
          </filter>

          <!-- Glowing Pin Shadow -->
          <filter id="pin-shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="4" stdDeviation="4" floodColor="#D9531E" floodOpacity="0.35" />
          </filter>

          <!-- Design Mood Building Linear Gradient -->
          <linearGradient id="designMoodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stopColor="#FFC899" />
            <stop offset="100%" stopColor="#FFA056" />
          </linearGradient>
        </defs>

        <!-- Map Base Background Layer -->
        <rect width="900" height="640" fill="#F4F3F0" />

        <!-- ==================== ROAD NETWORK ==================== -->

        <!-- Background Gray Land Blocks -->
        <rect x="180" y="110" width="280" height="360" fill="#ECEAE5" rx="2" />
        <rect x="520" y="110" width="280" height="360" fill="#ECEAE5" rx="2" />
        <rect x="80" y="510" width="740" height="130" fill="#E8E6E1" rx="2" />

        <!-- White Main Roads -->
        <rect x="100" y="0" width="80" height="510" fill="#FFFFFF" />
        <rect x="460" y="0" width="60" height="510" fill="#FFFFFF" />
        <rect x="800" y="0" width="70" height="510" fill="#FFFFFF" />
        <rect x="0" y="470" width="900" height="40" fill="#FFFFFF" />

        <!-- Road Outer Border Lines -->
        <line x1="100" y1="0" x2="100" y2="470" stroke="#DDD7CE" stroke-width="1.5" />
        <line x1="180" y1="0" x2="180" y2="470" stroke="#DDD7CE" stroke-width="1.5" />
        <line x1="460" y1="0" x2="460" y2="470" stroke="#DDD7CE" stroke-width="1.5" />
        <line x1="520" y1="0" x2="520" y2="470" stroke="#DDD7CE" stroke-width="1.5" />
        <line x1="800" y1="0" x2="800" y2="470" stroke="#DDD7CE" stroke-width="1.5" />
        <line x1="870" y1="0" x2="870" y2="470" stroke="#DDD7CE" stroke-width="1.5" />

        <line x1="0" y1="470" x2="900" y2="470" stroke="#DDD7CE" stroke-width="1.5" />
        <line x1="0" y1="510" x2="900" y2="510" stroke="#DDD7CE" stroke-width="1.5" />

        <!-- Road Name Vertical Labels -->
        <text x="140" y="240" fill="#665E55" font-size="14" font-weight="600" text-anchor="middle" transform="rotate(-90 140 240)">
          충열로 16번길
        </text>
        <text x="490" y="240" fill="#665E55" font-size="14" font-weight="600" text-anchor="middle" transform="rotate(-90 490 240)">
          충열로 16번길
        </text>
        <text x="835" y="240" fill="#665E55" font-size="14" font-weight="600" text-anchor="middle" transform="rotate(-90 835 240)">
          영서로 2756번길
        </text>
        <text x="500" y="496" fill="#665E55" font-size="15" font-weight="600" text-anchor="middle">
          충열로 20번길
        </text>

        <!-- ==================== BUILDINGS - TOP LEFT BLOCK ==================== -->
        <path d="M 205 130 H 325 V 150 H 350 V 215 H 205 Z" fill="#FFF8F0" stroke="#554D44" stroke-width="1.5" filter="url(#building-shadow)" />

        <rect x="365" y="145" width="80" height="70" fill="#FFF8F0" stroke="#554D44" stroke-width="1.5" filter="url(#building-shadow)" />
        <text x="405" y="186" fill="#332D27" font-size="14" font-weight="700" text-anchor="middle">BBQ</text>

        <path d="M 205 230 H 260 V 310 H 295 V 450 H 205 Z" fill="#FFF8F0" stroke="#554D44" stroke-width="1.5" filter="url(#building-shadow)" />
        <text x="250" y="345" fill="#332D27" font-size="14" font-weight="700" text-anchor="middle">대청마루</text>

        <!-- DESIGN MOOD BUILDING (HIGHLIGHTED ORANGE) -->
        <g id="design-mood-building">
          <path d="M 310 320 H 455 V 450 H 310 Z" fill="url(#designMoodGrad)" stroke="#D9531E" stroke-width="2.5" filter="url(#building-shadow)" />
          <g transform="translate(382, 385)">
            <path d="M -16 -12 L 0 -26 L 16 -12 V 12 H -16 Z" fill="none" stroke="#2C1A11" stroke-width="2.2" stroke-linejoin="round" />
            <text x="0" y="-1" fill="#2C1A11" font-size="11" font-weight="800" text-anchor="middle">M</text>
            <text x="0" y="28" fill="#1C1009" font-size="13" font-weight="800" text-anchor="middle">Design Mood</text>
          </g>
        </g>

        <!-- ==================== BUILDINGS - TOP RIGHT BLOCK ==================== -->
        <path d="M 535 130 H 605 V 145 H 645 V 215 H 535 Z" fill="#FFF8F0" stroke="#554D44" stroke-width="1.5" filter="url(#building-shadow)" />
        <rect x="660" y="130" width="125" height="85" fill="#FFF8F0" stroke="#554D44" stroke-width="1.5" filter="url(#building-shadow)" />

        <rect x="535" y="230" width="110" height="80" fill="#FFF8F0" stroke="#554D44" stroke-width="1.5" filter="url(#building-shadow)" />
        <text x="590" y="266" fill="#332D27" font-size="14" font-weight="700" text-anchor="middle">참미</text>
        <text x="590" y="288" fill="#332D27" font-size="14" font-weight="700" text-anchor="middle">닭갈비</text>

        <rect x="660" y="230" width="125" height="80" fill="#FFF8F0" stroke="#554D44" stroke-width="1.5" filter="url(#building-shadow)" />

        <rect x="535" y="325" width="75" height="125" fill="#FFF8F0" stroke="#554D44" stroke-width="1.5" filter="url(#building-shadow)" />
        <text x="572" y="378" fill="#332D27" font-size="14" font-weight="700" text-anchor="middle">대영</text>
        <text x="572" y="400" fill="#332D27" font-size="14" font-weight="700" text-anchor="middle">닭갈비</text>

        <path d="M 625 325 H 685 V 450 H 625 Z" fill="#FFF8F0" stroke="#554D44" stroke-width="1.5" filter="url(#building-shadow)" />
        <text x="655" y="378" fill="#332D27" font-size="13" font-weight="700" text-anchor="middle">CAFE</text>
        <text x="655" y="398" fill="#332D27" font-size="13" font-weight="700" text-anchor="middle">HWA</text>

        <path d="M 700 335 H 785 V 420 L 760 450 H 700 Z" fill="#FFF8F0" stroke="#554D44" stroke-width="1.5" filter="url(#building-shadow)" />

        <!-- ==================== BUILDINGS - BOTTOM AREA ==================== -->
        <rect x="235" y="545" width="130" height="80" fill="#FFF8F0" stroke="#554D44" stroke-width="1.5" filter="url(#building-shadow)" />
        <text x="300" y="593" fill="#2C241D" font-size="18" font-weight="700" text-anchor="middle">103동</text>

        <rect x="395" y="545" width="150" height="80" fill="#FFF8F0" stroke="#554D44" stroke-width="1.5" filter="url(#building-shadow)" />
        <text x="470" y="582" fill="#2C241D" font-size="15" font-weight="700" text-anchor="middle">우두동</text>
        <text x="470" y="605" fill="#2C241D" font-size="15" font-weight="700" text-anchor="middle">삼성 아파트</text>

        <rect x="575" y="545" width="130" height="80" fill="#FFF8F0" stroke="#554D44" stroke-width="1.5" filter="url(#building-shadow)" />
        <text x="640" y="593" fill="#2C241D" font-size="18" font-weight="700" text-anchor="middle">102동</text>

        <!-- ==================== DESTINATION PIN & BADGE ==================== -->
        <g transform="translate(425, 410)" filter="url(#pin-shadow)">
          <path d="M 0 0 C -14 -14, -20 -28, -20 -40 C -20 -53, -9 -62, 0 -62 C 9 -62, 20 -53, 20 -40 C 20 -28, 14 -14, 0 0 Z" fill="#E03E00" stroke="#FFFFFF" stroke-width="2.5" />
          <circle cx="0" cy="-40" r="8" fill="#FFFFFF" />
          <rect x="-35" y="6" width="70" height="24" rx="4" fill="#000000" />
          <text x="0" y="23" fill="#FFFFFF" font-size="13" font-weight="800" text-anchor="middle">도착지</text>
        </g>
      </svg>
    </div>
  </div>

</body>
</html>
